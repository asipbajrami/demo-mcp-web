<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo MCP Web - HTML Pages</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
        }
        .menu-item {
            transition: all 0.3s ease;
        }
        .menu-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366F1;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="gradient-bg text-white py-8">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-2">Demo MCP Web</h1>
            <p class="text-xl">Available HTML Pages</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12">
        <div id="file-list" class="grid md:grid-cols-2 gap-6">
            <div class="loader"></div>
            <p class="text-center col-span-2">Loading available HTML files...</p>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4 text-center">
            <p>Demo MCP Web - HTML Page Navigator</p>
            <p class="text-gray-400 text-sm mt-2">© 2025 Demo Project</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get the current path
            const currentPath = window.location.pathname;
            const repoPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            
            // Function to get the title from an HTML file content
            async function getTitleFromHtml(url) {
                try {
                    const response = await fetch(url);
                    const html = await response.text();
                    const titleMatch = html.match(/<title>(.*?)<\/title>/i);
                    return titleMatch ? titleMatch[1] : null;
                } catch (error) {
                    console.error('Error fetching title:', error);
                    return null;
                }
            }

            // Random descriptions for files where we can't extract meaningful content
            const defaultDescriptions = [
                "View documentation and examples.",
                "Explore this HTML page for more information.",
                "Additional content and resources available here.",
                "Check out this page for details and examples.",
                "View diagrams and visual representations."
            ];

            // Random border colors for variety
            const borderColors = [
                'border-indigo-500',
                'border-purple-500',
                'border-green-500',
                'border-yellow-500',
                'border-red-500',
                'border-blue-500',
                'border-pink-500',
                'border-teal-500'
            ];

            // Random tag background colors matching the borders
            const tagColors = [
                { bg: 'bg-indigo-100', text: 'text-indigo-800' },
                { bg: 'bg-purple-100', text: 'text-purple-800' },
                { bg: 'bg-green-100', text: 'text-green-800' },
                { bg: 'bg-yellow-100', text: 'text-yellow-800' },
                { bg: 'bg-red-100', text: 'text-red-800' },
                { bg: 'bg-blue-100', text: 'text-blue-800' },
                { bg: 'bg-pink-100', text: 'text-pink-800' },
                { bg: 'bg-teal-100', text: 'text-teal-800' }
            ];

            // Function to list all HTML files in the directory
            async function listHtmlFiles() {
                try {
                    // First method: Using fetch to get directory listing via GitHub API
                    // Note: If deployed elsewhere, we may need a server-side solution or to use the second method

                    // For GitHub pages, we can use the API for the repository
                    const repoOwner = 'asipbajrami';
                    const repoName = 'demo-mcp-web';
                    const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    
                    // Filter only HTML files
                    const htmlFiles = data.filter(file => 
                        file.name.toLowerCase().endsWith('.html') && 
                        file.type === 'file'
                    );
                    
                    return htmlFiles;
                    
                } catch (error) {
                    console.error('Error listing files from GitHub API:', error);
                    
                    // Fallback method: Hardcoded list of HTML files we know exist
                    // This is used if the GitHub API call fails
                    return [
                        { name: 'index.html', path: 'index.html', download_url: 'index.html' },
                        { name: 'ecommerce-api-diagram.html', path: 'ecommerce-api-diagram.html', download_url: 'ecommerce-api-diagram.html' },
                        { name: 'real-world-usecase.html', path: 'real-world-usecase.html', download_url: 'real-world-usecase.html' },
                        { name: 'simple-use-case.html', path: 'simple-use-case.html', download_url: 'simple-use-case.html' }
                    ];
                }
            }

            // Function to create card for each HTML file
            async function displayHtmlFiles() {
                const fileList = document.getElementById('file-list');
                fileList.innerHTML = ''; // Clear loading message
                
                const files = await listHtmlFiles();
                
                // Sort files to put index.html first
                files.sort((a, b) => {
                    if (a.name === 'index.html') return -1;
                    if (b.name === 'index.html') return 1;
                    return a.name.localeCompare(b.name);
                });
                
                for (const file of files) {
                    // Skip if it's a directory
                    if (file.type === 'dir') continue;
                    
                    // Get a random border color and matching tag color
                    const colorIndex = Math.floor(Math.random() * borderColors.length);
                    const borderColor = borderColors[colorIndex];
                    const tagColor = tagColors[colorIndex];
                    
                    // Try to get the title from the HTML file
                    let title = await getTitleFromHtml(file.download_url);
                    if (!title || title.trim() === '') {
                        // Format the filename as a title if no title tag found
                        title = file.name
                            .replace('.html', '')
                            .split('-')
                            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                            .join(' ');
                    }
                    
                    // Get a random description
                    const description = defaultDescriptions[Math.floor(Math.random() * defaultDescriptions.length)];
                    
                    // Format the display name (for index.html, call it "Home")
                    const displayName = file.name === 'index.html' ? 'Home Page' : title;
                    
                    // Create the card HTML
                    const card = document.createElement('a');
                    card.href = file.path;
                    card.className = `bg-white rounded-lg shadow-md p-6 menu-item border-l-4 ${borderColor}`;
                    card.innerHTML = `
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">${displayName}</h2>
                        <p class="text-gray-700 mb-4">${description}</p>
                        <div class="flex justify-end">
                            <span class="px-3 py-1 ${tagColor.bg} ${tagColor.text} rounded-full text-sm">${file.name}</span>
                        </div>
                    `;
                    
                    fileList.appendChild(card);
                }
                
                // Show message if no files found
                if (files.length === 0) {
                    fileList.innerHTML = '<p class="text-center col-span-2">No HTML files found in this directory.</p>';
                }
            }
            
            // Initialize the page
            displayHtmlFiles();
        });
    </script>
</body>
</html>
